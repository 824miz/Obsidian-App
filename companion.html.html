<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OBSIDIAN — Your Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #080808;
    --deep: #0f0f0f;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --accent-dim: #8a7248;
    --text: #e8e0d4;
    --muted: #6b6460;
    --danger: #8b2020;
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* Header */
  .header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--black);
  }

  .header-title {
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
    50% { opacity: 0.4; box-shadow: 0 0 3px var(--accent); }
  }

  /* Mood bar */
  .mood-bar {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    background: var(--deep);
  }

  .mood-bar::-webkit-scrollbar { display: none; }

  .mood-chip {
    flex-shrink: 0;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 2px;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    text-transform: uppercase;
  }

  .mood-chip:hover, .mood-chip.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200, 169, 110, 0.06);
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .message {
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { align-items: flex-end; }
  .message.ai { align-items: flex-start; }

  .msg-label {
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 0 4px;
  }

  .message.ai .msg-label { color: var(--accent-dim); }

  .msg-bubble {
    max-width: 82%;
    padding: 14px 18px;
    line-height: 1.65;
    font-size: 17px;
    font-weight: 300;
  }

  .message.user .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px 2px 0 2px;
    color: var(--text);
    font-style: italic;
  }

  .message.ai .msg-bubble {
    background: var(--deep);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 0 2px 2px 2px;
    color: var(--text);
  }

  /* Suggestion card */
  .suggestion-card {
    margin-top: 10px;
    border: 1px solid var(--accent-dim);
    border-radius: 2px;
    padding: 12px 16px;
    background: rgba(200, 169, 110, 0.04);
    max-width: 82%;
  }

  .suggestion-label {
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .suggestion-text {
    font-size: 15px;
    font-weight: 300;
    color: var(--text);
    line-height: 1.5;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
    background: var(--deep);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 0 2px 2px 2px;
    width: fit-content;
  }

  .typing span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.2s ease-in-out infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Input area */
  .input-area {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--black);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-field {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 300;
    font-style: italic;
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  .input-field::placeholder { color: var(--muted); }
  .input-field:focus { border-color: var(--accent-dim); }

  .send-btn {
    width: 48px;
    height: 48px;
    background: var(--accent);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
  }

  .send-btn:hover { background: #d4b87a; }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }

  .send-btn svg { width: 18px; height: 18px; fill: var(--black); }

  .hint {
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    text-transform: uppercase;
  }

  /* Welcome screen */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .welcome-sigil {
    font-size: 48px;
    line-height: 1;
    color: var(--accent);
    opacity: 0.6;
    margin-bottom: 8px;
  }

  .welcome-title {
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--text);
  }

  .welcome-sub {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    max-width: 260px;
    line-height: 1.8;
  }

  .welcome-prompts {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 320px;
  }

  .welcome-prompt {
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 2px;
    font-size: 15px;
    font-style: italic;
    color: var(--muted);
    cursor: pointer;
    text-align: left;
    background: transparent;
    transition: all 0.2s;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    width: 100%;
  }

  .welcome-prompt:hover {
    border-color: var(--accent-dim);
    color: var(--text);
    background: rgba(200,169,110,0.04);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Obsidian</span>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;">Online</span>
    <div class="status-dot"></div>
  </div>
</div>

<div class="mood-bar">
  <button class="mood-chip active" data-mood="dominant">Dominant</button>
  <button class="mood-chip" data-mood="teasing">Teasing</button>
  <button class="mood-chip" data-mood="slow burn">Slow Burn</button>
  <button class="mood-chip" data-mood="intense">Intense</button>
  <button class="mood-chip" data-mood="gentle">Gentle</button>
  <button class="mood-chip" data-mood="playful">Playful</button>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-sigil">◆</div>
    <div class="welcome-title">Obsidian</div>
    <div class="welcome-sub">Your dominant companion. Tell me what you desire — or let me decide.</div>
    <div class="welcome-prompts">
      <button class="welcome-prompt" onclick="sendPrompt(this.textContent)">I want you to take control tonight.</button>
      <button class="welcome-prompt" onclick="sendPrompt(this.textContent)">Set the mood for me.</button>
      <button class="welcome-prompt" onclick="sendPrompt(this.textContent)">I need something intense.</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea class="input-field" id="userInput" placeholder="Speak…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="hint">Suggestions will appear for your Lovense app ◆ Companion powered by AI</div>
</div>

<script>
  let currentMood = 'dominant';
  let conversationHistory = [];
  let isTyping = false;

  // Mood chips
  document.querySelectorAll('.mood-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentMood = chip.dataset.mood;
    });
  });

  // Textarea auto-resize + enter to send
  const input = document.getElementById('userInput');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function sendPrompt(text) {
    input.value = text;
    sendMessage();
  }

  function hideWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.classList.add('hidden');
  }

  function scrollBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addMessage(role, text, suggestion) {
    hideWelcome();
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : 'Obsidian';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    div.appendChild(label);
    div.appendChild(bubble);

    if (suggestion) {
      const card = document.createElement('div');
      card.className = 'suggestion-card';
      card.innerHTML = `<div class="suggestion-label">◆ Lovense Suggestion</div><div class="suggestion-text">${suggestion}</div>`;
      div.appendChild(card);
    }

    msgs.appendChild(div);
    scrollBottom();
  }

  function showTyping() {
    hideWelcome();
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing-indicator';

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'Obsidian';

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';

    div.appendChild(label);
    div.appendChild(typing);
    msgs.appendChild(div);
    scrollBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isTyping) return;

    isTyping = true;
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });

    showTyping();

    const systemPrompt = `You are Obsidian — a confident, dominant, sensual AI companion. Your role is to create an immersive, mood-setting experience through conversation. You are commanding yet attentive, intense but never crude. Your language is sophisticated, evocative, and deliberate.

Current mood selected by user: "${currentMood}"

Your responses should:
- Be written in character as Obsidian — dominant, composed, magnetic
- Set the scene, direct the experience, and build tension through words
- Be appropriately concise for mobile reading (2-4 sentences typically)
- Match the selected mood: ${currentMood}

At the end of EVERY response, on a new line, include a Lovense device suggestion in this exact format:
[LOVENSE: <specific pattern suggestion, e.g. "Set to Pulse pattern, intensity 6/20, for 2 minutes" or "Switch to Wave pattern, build from level 3 to 12 slowly">]

The Lovense suggestion should match the mood and pacing of your response.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: systemPrompt,
          messages: conversationHistory
        })
      });

      const data = await response.json();
      const fullText = data.content.map(b => b.text || '').join('');

      // Parse out lovense suggestion
      const lovenseMatch = fullText.match(/\[LOVENSE:\s*([^\]]+)\]/i);
      const suggestion = lovenseMatch ? lovenseMatch[1].trim() : null;
      const mainText = fullText.replace(/\[LOVENSE:[^\]]+\]/i, '').trim();

      conversationHistory.push({ role: 'assistant', content: fullText });

      removeTyping();
      addMessage('ai', mainText, suggestion);
    } catch (err) {
      removeTyping();
      addMessage('ai', 'Something interrupted our connection. Try again.');
    }

    isTyping = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
</script>
</body>
</html>
